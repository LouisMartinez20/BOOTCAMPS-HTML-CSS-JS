<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Chat</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0f1115;
        color: #fff;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 260px;
        background: #14181e;
        box-sizing: border-box;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
      }

      .main-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 18px 20px;
        gap: 18px;
        box-sizing: border-box;
        min-width: 0;
      }
      .workspace {
        flex: 1;
        display: flex;
        gap: 18px;
        min-height: 0;
      }
      .chat {
        width: 260px;
        display: flex;
        flex-direction: column;
        background: #1b2026;
        border-radius: 10px;
        padding: 14px;
        box-sizing: border-box;
        min-height: 0;
        overflow: auto;
      }
      .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 0;
        min-width: 0;
      }
      .block {
        background: #1b2026;
        border-radius: 10px;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        min-height: 70px;
      }
      .nav {
        min-height: 70px;
      }
      .content {
        flex: 1;
        min-height: 0;
      }
      .message {
        min-height: 110px;
      }
      /* Ejemplo de items inside chat */
      .chat-item {
        background: #232a32;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
      }
      .chat-item + .chat-item {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="sidebar"></div>
      <div class="main-column">
        <div class="block nav">NAV</div>
        <div class="workspace">
          <div class="panel">
            <div class="block content">CONTENT</div>
            <div class="block message">MESSAGE</div>
          </div>
          <div class="chat"></div>
        </div>
      </div>
    </div>
  </body>
</html>
